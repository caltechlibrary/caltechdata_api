name: CodeMeta2CFF
run-name: Run CodeMeta2CFF after ${{github.event_name}} by ${{github.actor}}

on:
  push:
    paths: ['codemeta.json']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason'
        required: false
        default: 'Manual trigger'

jobs:
  CodeMeta2CFF:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Convert CFF
        uses: caltechlibrary/codemeta2cff@main
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Update pyproject.toml from codemeta.json
        run: uv run --no-project --with tomlkit python .github/scripts/codemeta_to_pyproject.py
      - name: Commit CFF
        uses: EndBug/add-and-commit@v10
        with:
          message: 'Add updated CITATION.cff and pyproject.toml from codemeta.json file'
          add: '["pyproject.toml", "CITATION.cff"]'
