name: Bot validation

on: [push, pull_request]

jobs:
  validate-metadata:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"

    - name: Run against CaltechData Test system
      env:
        RDMTOK: ${{ secrets.CALTECHDATA_TOKEN }}
      run: |
        uv run pytest tests/test_unit.py
        uv run pytest tests/test_rdm.py
    
    - name: Run Medata Validation Test and RDM
      env:
        RDMTOK: ${{ secrets.CALTECHDATA_TOKEN }}
      run: uv run python tests/bot_yaml.py
